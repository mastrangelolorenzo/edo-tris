<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 650" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#333"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#666"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b5651d"/>
    </marker>
  </defs>
  <rect width="1150" height="650" fill="#ffffff"/>

  <!-- zone di distribuzione -->
  <rect x="15" y="38" width="200" height="320" rx="14" fill="#f7faff" stroke="#888" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="25" y="31" font-weight="bold" fill="#555">pc1 &#183; utente (profilo pc1)</text>
  <rect x="315" y="38" width="575" height="552" rx="14" fill="#fafafa" stroke="#888" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="325" y="31" font-weight="bold" fill="#555">pc2 &#183; resto del sistema (profilo pc2)</text>

  <rect x="945" y="38" width="190" height="150" rx="14" fill="#fafafa" stroke="#888" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="955" y="31" font-weight="bold" fill="#555">altra macchina (opzionale)</text>
  <rect x="960" y="70" width="160" height="100" rx="8" fill="#eee" stroke="#666" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1040" y="100" text-anchor="middle" font-weight="bold" font-size="14">TRIS esterno</text>
  <text x="1040" y="120" text-anchor="middle" fill="#555">motore IA &#183; TCP</text>
  <text x="1040" y="136" text-anchor="middle" fill="#555" font-size="11">IP e porta = tris.host,</text>
  <text x="1040" y="149" text-anchor="middle" fill="#555" font-size="11">tris.port (config.json)</text>
  <g stroke="#666" stroke-width="1.6" stroke-dasharray="3 3" fill="none" marker-end="url(#g)">
    <line x1="870" y1="100" x2="960" y2="100"/>
    <line x1="960" y1="140" x2="870" y2="140"/>
  </g>
  <g text-anchor="middle" fill="#555" font-size="11">
    <text x="915" y="94"><tspan font-weight="bold">6</tspan> "n"</text>
    <text x="915" y="157"><tspan font-weight="bold">7</tspan> "m"/F,X,Y</text>
    <text x="915" y="118" font-style="italic">oppure</text>
  </g>

  <!-- broker -->
  <rect x="330" y="50" width="240" height="528" rx="12" fill="#fff3d6" stroke="#b5651d" stroke-width="2"/>
  <text x="450" y="75" text-anchor="middle" font-size="15" font-weight="bold">BROCKER (crossbar.io)</text>
  <text x="450" y="93" text-anchor="middle" fill="#555">realm1 &#183; ws://:8080/ws</text>
  <text x="450" y="568" text-anchor="middle" fill="#555">RPC (call/register) + pub/sub</text>

  <!-- pc1 -->
  <rect x="30" y="55" width="170" height="90" rx="8" fill="#e3efff" stroke="#1a6fd8" stroke-width="2"/>
  <text x="115" y="85" text-anchor="middle" font-weight="bold" font-size="14">WINGRID</text>
  <text x="115" y="105" text-anchor="middle" fill="#555">html + javascript</text>
  <text x="115" y="121" text-anchor="middle" fill="#555">nginx &#183; :8880</text>

  <rect x="30" y="205" width="170" height="120" rx="8" fill="#e3efff" stroke="#1a6fd8" stroke-width="2"/>
  <text x="115" y="235" text-anchor="middle" font-weight="bold" font-size="14">EDO-X</text>
  <text x="115" y="255" text-anchor="middle" fill="#555">python &#183; braccio umano</text>

  <text x="115" y="385" text-anchor="middle" fill="#555">pc1 trova il broker in</text>
  <text x="115" y="401" text-anchor="middle" fill="#555">config.json &#8594; broker</text>
  <text x="115" y="417" text-anchor="middle" fill="#555">(host, port: NAT di pc2)</text>

  <!-- pc2 (colonna destra) -->
  <rect x="700" y="70" width="170" height="100" rx="8" fill="#e6f4e1" stroke="#3a8a2a" stroke-width="2"/>
  <text x="785" y="100" text-anchor="middle" font-weight="bold" font-size="14">BUTLER</text>
  <text x="785" y="120" text-anchor="middle" fill="#555">python &#183; ponte</text>
  <text x="785" y="136" text-anchor="middle" fill="#555">WAMP &#8596; TCP</text>

  <rect x="700" y="230" width="170" height="60" rx="8" fill="#eee" stroke="#666" stroke-width="2"/>
  <text x="785" y="256" text-anchor="middle" font-weight="bold" font-size="14">TRIS</text>
  <text x="785" y="276" text-anchor="middle" fill="#555">simulato &#183; container</text>
  <text x="785" y="308" text-anchor="middle" fill="#555" font-size="11">butler sceglie in config.json</text>
  <text x="785" y="321" text-anchor="middle" fill="#555" font-size="11">&#8594; tris (simulato o esterno)</text>

  <rect x="700" y="330" width="170" height="110" rx="8" fill="#fde5e0" stroke="#d8351a" stroke-width="2"/>
  <text x="785" y="360" text-anchor="middle" font-weight="bold" font-size="14">EDO-Y</text>
  <text x="785" y="380" text-anchor="middle" fill="#555">python &#183; braccio agente</text>

  <rect x="700" y="470" width="170" height="90" rx="8" fill="#efe6fa" stroke="#7a3fb5" stroke-width="2"/>
  <text x="785" y="498" text-anchor="middle" font-weight="bold" font-size="14">FRAME</text>
  <text x="785" y="518" text-anchor="middle" fill="#555">python &#183; coordinate</text>
  <text x="785" y="534" text-anchor="middle" fill="#555">globali &#8594; locali</text>
  <text x="785" y="550" text-anchor="middle" fill="#555" font-size="11">legge field.json</text>

  <!-- RPC -->
  <g stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <!-- pc1 <-> broker -->
    <line x1="200" y1="75" x2="330" y2="75"/>          <!-- 1 -->
    <line x1="330" y1="100" x2="200" y2="100"/>        <!-- 12 -->
    <line x1="330" y1="225" x2="200" y2="225"/>        <!-- 2 -->
    <line x1="200" y1="250" x2="330" y2="250"/>        <!-- 3 -->
    <line x1="200" y1="275" x2="330" y2="275"/>        <!-- 4 -->
    <!-- broker <-> pc2 -->
    <line x1="570" y1="95" x2="700" y2="95"/>          <!-- 5 -->
    <line x1="700" y1="125" x2="570" y2="125"/>        <!-- 8 -->
    <line x1="570" y1="355" x2="700" y2="355"/>        <!-- 9 -->
    <line x1="700" y1="380" x2="570" y2="380"/>        <!-- 10 -->
    <line x1="700" y1="405" x2="570" y2="405"/>        <!-- 11 -->
    <line x1="570" y1="515" x2="700" y2="515"/>        <!-- 3 / 10 -> FRAME -->
    <!-- butler <-> tris -->
    <line x1="760" y1="170" x2="760" y2="230"/>        <!-- 6 -->
    <line x1="810" y1="230" x2="810" y2="170"/>        <!-- 7 -->
  </g>
  <!-- pubblicazione esiti -->
  <g stroke="#b5651d" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#p)">
    <line x1="700" y1="155" x2="570" y2="155"/>
    <line x1="330" y1="130" x2="200" y2="130"/>
    <line x1="330" y1="305" x2="200" y2="305"/>
    <line x1="570" y1="430" x2="700" y2="430"/>
  </g>

  <g text-anchor="middle" fill="#111">
    <!-- sinistra -->
    <text x="265" y="70"><tspan font-weight="bold">1</tspan> call moveX</text>
    <text x="265" y="95"><tspan font-weight="bold">12</tspan> call movedY</text>
    <text x="265" y="125" fill="#b5651d">esito (subscribe)</text>
    <text x="265" y="220"><tspan font-weight="bold">2</tspan> moveX</text>
    <text x="265" y="245" font-size="11"><tspan font-weight="bold">3</tspan> call localPiece/Cell</text>
    <text x="265" y="270"><tspan font-weight="bold">4</tspan> call movedX</text>
    <text x="265" y="300" fill="#b5651d">esito (subscribe)</text>
    <!-- destra -->
    <text x="635" y="90"><tspan font-weight="bold">5</tspan> movedX</text>
    <text x="635" y="120"><tspan font-weight="bold">8</tspan> call moveY</text>
    <text x="635" y="150" fill="#b5651d">esito (publish)</text>
    <text x="635" y="350"><tspan font-weight="bold">9</tspan> moveY</text>
    <text x="635" y="375" font-size="11"><tspan font-weight="bold">10</tspan> call localPiece/Cell</text>
    <text x="635" y="400"><tspan font-weight="bold">11</tspan> call movedY</text>
    <text x="635" y="425" fill="#b5651d">esito (subscribe)</text>
    <text x="635" y="498" font-size="11"><tspan font-weight="bold">3</tspan> e <tspan font-weight="bold">10</tspan>: localPiece,</text>
    <text x="635" y="511" font-size="11">localCell</text>
    <text x="752" y="204" text-anchor="end"><tspan font-weight="bold">6</tspan> "n"</text>
    <text x="818" y="204" text-anchor="start"><tspan font-weight="bold">7</tspan> "m" / F,X,Y</text>
  </g>

  <!-- legenda -->
  <g transform="translate(30,610)" fill="#333">
    <line x1="0" y1="8" x2="30" y2="8" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="38" y="12">RPC (numero = ordine dei passaggi di una mossa; le risposte non sono disegnate)</text>
    <line x1="0" y1="28" x2="30" y2="28" stroke="#b5651d" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#p)"/>
    <text x="38" y="32">pub/sub: flap, winner_x, winner_y (solo a fine partita)</text>
  </g>
</svg>
