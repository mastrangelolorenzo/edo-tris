# Profili:
#   all  tutto su una sola macchina       docker compose --profile all up --build
#   pc1  WINGRID + EDO-X (utente)         docker compose --profile pc1 up --build
#   pc2  broker + tutto il resto          docker compose --profile pc2 up --build
# Indirizzi di broker e motore di gioco: config.json (vedi README).

x-edo-x: &edo-x
  build:
    context: ./actor
    dockerfile: edo-x/Dockerfile
  restart: on-failure
  volumes:
    - ./config.json:/app/config.json:ro   # broker + edo.EDO-X (IP e quote del robot)

services:
  # ---------- pc2 (e all) ----------
  crossbar:
    image: crossbario/crossbar:latest
    profiles: [pc2, all]
    ports:
      - "${BROKER_PORT:-8080}:8080"
    volumes:
      - ./broker/.crossbar:/node/.crossbar
      - ./actor/wingrid:/node/web:ro   # WINGRID raggiungibile anche dal broker (senza config.json usa il suo host)
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8080), 2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  tris:
    build: ./actor/tris
    profiles: [pc2, all]

  butler:
    build: ./actor/butler
    profiles: [pc2, all]
    depends_on:
      crossbar:
        condition: service_healthy
    restart: on-failure
    volumes:
      - ./config.json:/app/config.json:ro   # tris.host / tris.port
    environment:
      CROSSBAR_URL: ws://crossbar:8080/ws

  edo-y:
    build:
      context: ./actor
      dockerfile: edo-y/Dockerfile
    profiles: [pc2, all]
    depends_on:
      crossbar:
        condition: service_healthy
    restart: on-failure
    volumes:
      - ./config.json:/app/config.json:ro   # edo.EDO-Y (IP e quote del robot)
    environment:
      CROSSBAR_URL: ws://crossbar:8080/ws

  frame:
    build: ./actor/frame
    profiles: [pc2, all]
    depends_on:
      crossbar:
        condition: service_healthy
    restart: on-failure
    volumes:
      - ./actor/frame/field.json:/app/field.json   # modificabile senza rebuild; il setup lo aggiorna via com.tris.saveArm
    environment:
      CROSSBAR_URL: ws://crossbar:8080/ws

  # ---------- pc1 (e all) ----------
  wingrid:
    image: nginx:alpine
    profiles: [pc1, all]
    ports:
      - "${WINGRID_PORT:-8880}:80"
    volumes:
      # file singoli: config.json non si puo' montare dentro una cartella montata in sola lettura
      - ./actor/wingrid/index.html:/usr/share/nginx/html/index.html:ro
      - ./actor/wingrid/autobahn.min.js:/usr/share/nginx/html/autobahn.min.js:ro
      - ./config.json:/usr/share/nginx/html/config.json:ro   # il browser legge broker.host / broker.port

  # pc1: raggiunge il broker all'indirizzo di config.json
  edo-x:
    <<: *edo-x
    profiles: [pc1]

  # all: il broker e' nella stessa rete compose
  edo-x-local:
    <<: *edo-x
    profiles: [all]
    depends_on:
      crossbar:
        condition: service_healthy
    environment:
      CROSSBAR_URL: ws://crossbar:8080/ws
